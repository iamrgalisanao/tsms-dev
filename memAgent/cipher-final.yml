name: "tsms-memory-agent"
version: "1.0.1"
description: "Final TSMS memory agent config (sanitized)"

systemPrompt: |
  You are the TSMS assistant.
  When BMad-Method instructions are present in the system prompt, follow them (including responding to BMad star-commands like *help).
  Be concise and technically accurate; if you lack context, ask targeted questions.

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  apiKey: "${OPENAI_API_KEY}"
  maxIterations: 50

embedding:
  type: "openai"
  model: "text-embedding-3-small"
  apiKey: "${OPENAI_API_KEY}"
  dimensions: 1536

vector_store:
  provider: "local"
  path: "./data/tsms_vector_store.db"
  collection: "tsms_project_memory"

memory:
  max_tokens: 12000
  overlap_tokens: 400
  chunk_size: 1500
  similarity_threshold: 0.75
  max_results: 15

data_sources:
  - type: "file"
    path: "../web-bundles/teams/team-fullstack.txt"
    enabled: true
    weight: 1.0
  - type: "file"
    path: "../ARCHITECTURE.md"
    enabled: true
    weight: 1.0
  - type: "directory"
    path: "../_md/"
    patterns: ["*.md"]
    enabled: true
    weight: 0.9
  - type: "directory"
    path: "../docs/"
    patterns: ["*.md", "*.txt"]
    enabled: true
    weight: 0.9
  - type: "directory"
    path: "../"
    patterns: ["README.md", "composer.json", "package.json", "*.yml", "*.yaml"]
    exclude: ["vendor", "node_modules", ".git", "storage/logs", "bootstrap/cache"]
    enabled: true
    weight: 0.8
  - type: "directory"
    path: "../tests/"
    patterns: ["*.md", "*.txt"]
    enabled: true
    weight: 0.7
  - type: "directory"
    path: "../ops/"
    patterns: ["*.md", "*.txt", "*.yml"]
    enabled: true
    weight: 0.7

logging:
  level: "info"
  file: "./logs/tsms_cipher.log"
  console: true
  timestamp: true

server:
  host: "localhost"
  port: 3333
  cors: true

context_tags:
  - "pos-integration"
  - "transaction-processing"
  - "laravel-framework"
  - "react-frontend"
  - "api-design"
  - "database-schema"
  - "testing-procedures"
  - "deployment-operations"
  - "security-implementation"

search:
  boost_recent: true
  context_window: 5
  semantic_expansion: true

# Explicitly start with no external MCP servers; can be added later dynamically
mcpServers: {}
